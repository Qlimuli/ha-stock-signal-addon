name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r stock_signal/requirements.txt
      - name: Python unit tests
        env:
          DATA_DIR: ${{ runner.temp }}/stock-signal-data
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax check
        run: node --check stock_signal/rootfs/app/static/app.js
