name: "Stock & ETF Signal Server"
version: "1.3.0"
slug: stock_signal
description: >
  Professioneller Aktien- und ETF-Signal-Server mit Multi-Indikator-Analyse
  (RSI, MACD, Bollinger, Stochastic, ADX, ATR). Long/Short/Neutral, ETF-Nachkauf,
  Portfolio mit P&L und gewichteten Empfehlungen. Web-GUI, MQTT, REST.
  Scalable Capital: Depot manuell oder via MCP/HA-Integration verknüpfen.
url: "https://github.com/Qlimuli/ha-stock-signal-addon"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:chart-timeline-variant
panel_title: Stock Signals
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "REST API & GUI (via Ingress)"
options:
  tickers: "AAPL,MSFT,NVDA,TSLA"
  etf_tickers: "VWCE.DE,SPY,QQQ,SXR8.DE"
  update_interval_minutes: 30
  mqtt_enabled: true
  mqtt_topic_prefix: "stock_signal"
  rsi_oversold: 30
  rsi_overbought: 70
  lookback_days: 180
schema:
  tickers: str
  etf_tickers: str
  update_interval_minutes: int(5,1440)
  mqtt_enabled: bool
  mqtt_topic_prefix: str
  rsi_oversold: int(10,40)
  rsi_overbought: int(60,90)
  lookback_days: int(30,365)
map:
  - type: share
    read_only: false
  - type: data
    read_only: false
services:
  - mqtt:want
